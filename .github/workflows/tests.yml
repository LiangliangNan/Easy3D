name: Test Easy3D
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.backend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: "VULKAN"
            vulkan: "ON"
          - os: ubuntu-24.04
            backend: "OPENGL"
            vulkan: "OFF"
          - os: windows-2022
            backend: "VULKAN"
            vulkan: "ON"
          - os: windows-2022
            backend: "OPENGL"
            vulkan: "OFF"
          - os: macos-15
            backend: "VULKAN"
            vulkan: "ON"
          - os: macos-15
            backend: "OPENGL"
            vulkan: "OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools \
            python3-dev patchelf libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev xvfb xauth mesa-common-dev libcgal-dev qt6-base-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja cgal qt ffmpeg wxwidgets

      - name: Set up Conda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          architecture: x64
          activate-environment: Easy3DDev
          auto-activate-base: false
          channels: conda-forge,defaults

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          conda install -y \
            ninja \
            conda-forge::qt6-main \
            conda-forge::wxwidgets \
            conda-forge::cgal \
            conda-forge::ffmpeg

      - name: Install official LunarG Vulkan SDK (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          set -euo pipefail
          version=1.4.363.1
          archive="$RUNNER_TEMP/vulkansdk-macos-$version.zip"
          curl -fL "https://sdk.lunarg.com/sdk/download/$version/mac/vulkansdk-macos-$version.zip" -o "$archive"
          printf '%s  %s\n' \
            a65c707cf0a32bf8c2ca6b9af1985b7af61dbadfc19b352dae51a323f3a547a6 "$archive" \
            | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          installer="$RUNNER_TEMP/vulkansdk-macOS-$version.app/Contents/MacOS/vulkansdk-macOS-$version"
          test -x "$installer"
          "$installer" --accept-licenses --default-answer --confirm-command install
          sdk="$HOME/VulkanSDK/$version/macOS"
          test -d "$sdk"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Configure MoltenVK (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          driver="$(find "$VULKAN_SDK" -path '*/icd.d/MoltenVK_icd.json' -print -quit)"
          layers="$(find "$VULKAN_SDK" -path '*/explicit_layer.d' -type d -print -quit)"
          test -n "$driver"
          test -n "$layers"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$layers" >> "$GITHUB_ENV"

      - name: Install official LunarG Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.1'
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-$version.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expectedHash = 'c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The downloaded LunarG Vulkan SDK checksum did not match'
          }
          $sdk = "C:\VulkanSDK\$version"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          )
          if ($process.ExitCode -ne 0) {
            throw "LunarG Vulkan SDK installer failed with exit code $($process.ExitCode)"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=${{ matrix.vulkan }} \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=${{ matrix.vulkan }} \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: |
          test -n "$VULKAN_SDK"
          cmake -S . -B build-vulkan -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" \
            -DwxWidgets_ROOT_DIR="$CONDA_PREFIX/Library" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=ON \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure OpenGL (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: |
          cmake -S . -B build-vulkan -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" \
            -DwxWidgets_ROOT_DIR="$CONDA_PREFIX/Library" \
            -DEasy3D_ENABLE_VULKAN=OFF \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Build (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: cmake --build build-vulkan --config Release --parallel 2

      - name: Build OpenGL (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: cmake --build build-vulkan --config Release --parallel 2

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build-vulkan --parallel 2

      - name: Configure Vulkan image-diff peer (Ubuntu OpenGL)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: |
          cmake -S . -B build-parity-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEasy3D_ENABLE_VULKAN=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_SHARED_LIBS=ON -DEasy3D_BUILD_TUTORIALS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Build Vulkan image-diff peer (Ubuntu OpenGL)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: cmake --build build-parity-vulkan --target easy3d_backend_image_diff_test --parallel 2

      - name: Validate SPIR-V (Ubuntu and macOS)
        if: matrix.backend == 'VULKAN' && runner.os != 'Windows'
        run: |
          for shader in build-vulkan/easy3d/renderer/backends/vulkan/*.spv; do
            spirv-val --target-env vulkan1.2 "$shader"
          done

      - name: Validate SPIR-V (Windows)
        if: matrix.backend == 'VULKAN' && runner.os == 'Windows'
        run: |
          $validator = Join-Path $env:VULKAN_SDK 'Bin/spirv-val.exe'
          Get-ChildItem build-vulkan/easy3d/renderer/backends/vulkan/*.spv |
            ForEach-Object {
              & $validator --target-env vulkan1.2 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Run tests without a display (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
          fi
          unset DISPLAY WAYLAND_DISPLAY
          ctest --test-dir build-vulkan --output-on-failure -LE desktop

      - name: Test configured window backend (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ctest --test-dir build-vulkan --output-on-failure -L desktop

      - name: Compare OpenGL and Vulkan effect/snapshot images (Ubuntu)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            python3 tests/cross_backend/image_diff.py \
              --opengl build-vulkan/bin/easy3d_backend_image_diff_test \
              --vulkan build-parity-vulkan/bin/easy3d_backend_image_diff_test \
              --output-dir build-parity-images --validation

      # Hosted Windows runners expose neither a Vulkan ICD nor a desktop OpenGL
      # driver, so no rendering test can run there. macOS is not so limited: the
      # Vulkan job runs its windowed tests through MoltenVK. Whether the deprecated
      # GL stack still yields a context on the hosted VM is not something to assert
      # from a comment, so the probe below runs the desktop-labelled suite and only
      # reports - drop continue-on-error once it is green and merge it into the step
      # above.
      - name: Test OpenGL without desktop contexts (Windows and macOS)
        if: runner.os != 'Linux' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -LE desktop

      - name: Probe desktop OpenGL contexts (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'OPENGL'
        continue-on-error: true
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -L desktop

      # The same question on Windows, measured with one bounded case instead of the
      # whole desktop suite: viewer.offscreen carries a 120 s CTest timeout, so a
      # runner without a GL driver fails fast rather than stalling the job. Drop
      # continue-on-error and fold it into -L desktop if it ever turns green.
      - name: Probe desktop OpenGL contexts (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        continue-on-error: true
        shell: bash -l {0}
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -R '^viewer\.offscreen$'

      # MoltenVK reports unsupported integer-attachment blending and hangs this test,
      # so only it stays excluded. algo.point_cloud_normal_estimation used to be
      # excluded here as well: with Boost's graph it ran tens of minutes on a hosted
      # runner against a 180 s timeout, and it now uses the Boost-free MST path
      # (3.2 s Release measured locally on 2026-11-14).
      - name: Test Vulkan on macOS
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -E '^vulkan\.transparency$'

      # Records what the runner actually exposes, so the exclusions above stay
      # verifiable from the log instead of resting on this comment.
      - name: Report Vulkan devices (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        continue-on-error: true
        shell: bash -l {0}
        run: '"$VULKAN_SDK/Bin/vulkaninfo.exe" --summary'

      # The hosted Windows runner has no Vulkan ICD, so this job runs every test that
      # does not require Vulkan rendering or a desktop context. The point-cloud normal
      # case is no longer in the list: the reason for dropping it was the Boost-based
      # reference it used to run, not the platform, and that reference is gone.
      - name: Test non-graphics suite (Windows Vulkan)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -LE desktop -E '^(vulkan\.|viewer\.offscreen)'

      # The exported package is exercised on every OS: install it, then configure and
      # build a consumer with find_package(Easy3D CONFIG). Only the device-dependent
      # binaries are run, and only where the runner can provide a device - Windows
      # stops here because it has none, and the macOS OpenGL job waits for the probe
      # above to say whether a GL context exists.
      - name: Install package and build consumer (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build-vulkan
          cmake -S tests/viewer/installed -B installed-consumer -G Ninja \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE
          cmake --build installed-consumer

      - name: Install package and build consumer (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          cmake --install build-vulkan --config Release
          cmake -S tests/viewer/installed -B installed-consumer \
            -G "Visual Studio 17 2022" -A x64 \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE
          cmake --build installed-consumer --config Release

      - name: Run installed-package consumers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
            unset DISPLAY WAYLAND_DISPLAY
            ./installed-consumer/installed_vulkan_consumer
            ./installed-consumer/installed_offscreen_consumer
          else
            xvfb-run -a ./installed-consumer/installed_offscreen_consumer
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ./installed-consumer/installed_viewer_consumer

      - name: Run installed-package consumers (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          ./installed-consumer/installed_vulkan_consumer
          ./installed-consumer/installed_offscreen_consumer
          ./installed-consumer/installed_viewer_consumer

      - uses: actions/upload-artifact@v7
        if: always() && matrix.backend == 'VULKAN' && runner.os != 'Windows'
        with:
          name: vulkan-capture-${{ matrix.os }}
          path: build-vulkan/tests/artifacts/vulkan.scene/vulkan-bunny.png
