name: Test Easy3D
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.backend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: "VULKAN"
            vulkan: "ON"
          - os: ubuntu-24.04
            backend: "OPENGL"
            vulkan: "OFF"
          - os: windows-2022
            backend: "VULKAN"
            vulkan: "ON"
          - os: windows-2022
            backend: "OPENGL"
            vulkan: "OFF"
          - os: macos-15
            backend: "VULKAN"
            vulkan: "ON"
          - os: macos-15
            backend: "OPENGL"
            vulkan: "OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools \
            python3-dev patchelf libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev xvfb xauth mesa-common-dev libcgal-dev qt6-base-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja cgal qt ffmpeg wxwidgets

      - name: Set up Conda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          architecture: x64
          activate-environment: Easy3DDev
          auto-activate-base: false
          channels: conda-forge,defaults

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          conda install -y \
            ninja \
            conda-forge::qt6-main \
            conda-forge::wxwidgets \
            conda-forge::cgal \
            conda-forge::ffmpeg

      - name: Install official LunarG Vulkan SDK (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          set -euo pipefail
          version=1.4.363.1
          archive="$RUNNER_TEMP/vulkansdk-macos-$version.zip"
          curl -fL "https://sdk.lunarg.com/sdk/download/$version/mac/vulkansdk-macos-$version.zip" -o "$archive"
          printf '%s  %s\n' \
            a65c707cf0a32bf8c2ca6b9af1985b7af61dbadfc19b352dae51a323f3a547a6 "$archive" \
            | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          installer="$RUNNER_TEMP/vulkansdk-macOS-$version.app/Contents/MacOS/vulkansdk-macOS-$version"
          test -x "$installer"
          "$installer" --accept-licenses --default-answer --confirm-command install
          sdk="$HOME/VulkanSDK/$version/macOS"
          test -d "$sdk"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Configure MoltenVK (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          driver="$(find "$VULKAN_SDK" -path '*/icd.d/MoltenVK_icd.json' -print -quit)"
          layers="$(find "$VULKAN_SDK" -path '*/explicit_layer.d' -type d -print -quit)"
          test -n "$driver"
          test -n "$layers"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$layers" >> "$GITHUB_ENV"

      - name: Install official LunarG Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.1'
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-$version.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expectedHash = 'c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The downloaded LunarG Vulkan SDK checksum did not match'
          }
          $sdk = "C:\VulkanSDK\$version"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          )
          if ($process.ExitCode -ne 0) {
            throw "LunarG Vulkan SDK installer failed with exit code $($process.ExitCode)"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=${{ matrix.vulkan }} \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=${{ matrix.vulkan }} \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: |
          test -n "$VULKAN_SDK"
          cmake -S . -B build-vulkan -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" \
            -DwxWidgets_ROOT_DIR="$CONDA_PREFIX/Library" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=ON \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Configure OpenGL (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: |
          cmake -S . -B build-vulkan -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" \
            -DwxWidgets_ROOT_DIR="$CONDA_PREFIX/Library" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=OFF \
            -DEasy3D_BUILD_SHARED_LIBS=ON \
            -DEasy3D_BUILD_TUTORIALS=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Build (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: cmake --build build-vulkan --config Release --parallel 2

      - name: Build OpenGL (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: cmake --build build-vulkan --config Release --parallel 2

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build-vulkan --parallel 2

      - name: Configure Vulkan image-diff peer (Ubuntu OpenGL)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: |
          cmake -S . -B build-parity-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEasy3D_ENABLE_VULKAN=ON -DEasy3D_BUILD_TESTS=ON \
            -DEasy3D_BUILD_SHARED_LIBS=ON -DEasy3D_BUILD_TUTORIALS=ON \
            -DEasy3D_BUILD_PYTHON_BINDINGS=ON \
            -DEasy3D_ENABLE_CGAL=ON -DEasy3D_ENABLE_QT=ON -DEasy3D_ENABLE_FFMPEG=ON

      - name: Build Vulkan image-diff peer (Ubuntu OpenGL)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: cmake --build build-parity-vulkan --target easy3d_backend_image_diff_test --parallel 2

      - name: Validate SPIR-V (Ubuntu and macOS)
        if: matrix.backend == 'VULKAN' && runner.os != 'Windows'
        run: |
          for shader in build-vulkan/easy3d/renderer/backends/vulkan/*.spv; do
            spirv-val --target-env vulkan1.2 "$shader"
          done

      - name: Validate SPIR-V (Windows)
        if: matrix.backend == 'VULKAN' && runner.os == 'Windows'
        run: |
          $validator = Join-Path $env:VULKAN_SDK 'Bin/spirv-val.exe'
          Get-ChildItem build-vulkan/easy3d/renderer/backends/vulkan/*.spv |
            ForEach-Object {
              & $validator --target-env vulkan1.2 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Run tests without a display (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
          fi
          unset DISPLAY WAYLAND_DISPLAY
          ctest --test-dir build-vulkan --output-on-failure -LE desktop

      - name: Test configured window backend (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ctest --test-dir build-vulkan --output-on-failure -L desktop

      - name: Compare OpenGL and Vulkan effect/snapshot images (Ubuntu)
        if: runner.os == 'Linux' && matrix.backend == 'OPENGL'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            python3 tests/cross_backend/image_diff.py \
              --opengl build-vulkan/bin/easy3d_backend_image_diff_test \
              --vulkan build-parity-vulkan/bin/easy3d_backend_image_diff_test \
              --output-dir build-parity-images --validation

      # Hosted Windows runners have no desktop OpenGL driver, now measured there rather than
      # read off the image specification: the probe below runs viewer.offscreen on run 15 and it
      # failed in 0.16 s with "GLFW error 65542: WGL: The driver does not appear to support
      # OpenGL" and "could not create an OpenGL 3.2 context!". Whether the image exposes a Vulkan
      # device is a separate question and the Vulkan job answers it for itself. macOS is not
      # limited for Vulkan - its job runs the windowed tests through MoltenVK - but its OpenGL
      # job is, and that was measured rather than assumed: running the whole
      # desktop-labelled suite there on 2026-11-14 (run 13) gave 74/74 failures,
      # every one of them at context creation with "NSGL: Failed to find a suitable
      # pixel format". The desktop suite stays out of the macOS OpenGL job because
      # the hosted arm64 VM has no desktop GL, not because of an old comment.
      - name: Test OpenGL without desktop contexts (Windows and macOS)
        if: runner.os != 'Linux' && matrix.backend == 'OPENGL'
        shell: bash -l {0}
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -LE desktop

      # The same question on Windows, measured with one bounded case instead of the
      # whole desktop suite: viewer.offscreen carries a 120 s CTest timeout, so a
      # runner without a GL driver fails fast rather than stalling the job. The verdict
      # is posted as an annotation because a continue-on-error step always reads green
      # in the job summary and the raw log needs a signed-in reader. Run 15 took the
      # warning branch (WGL: the driver does not appear to support OpenGL), so the
      # exclusion stands; the probe stays because a future image can answer differently.
      - name: Probe desktop OpenGL contexts (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'OPENGL'
        continue-on-error: true
        shell: bash -l {0}
        run: |
          if ctest --test-dir build-vulkan --output-on-failure -C Release -R '^viewer\.offscreen$'; then
            echo '::notice::desktop OpenGL works on the Windows runner: fold this case into -L desktop and drop the exclusion'
          else
            echo '::warning::desktop OpenGL unavailable on the Windows runner: the step above keeps -LE desktop'
          fi

      # MoltenVK's integer-attachment-blending warning is long documented and harmless; the
      # "hangs this test" half of the note came from the archived workflow and was never
      # re-measured here. Locally on 2026-11-14 (MoltenVK 1.4.2, --validation, repeated runs)
      # the test passes in 0.3 s, so the exclusion is probed rather than inherited: the step
      # below runs exactly the excluded test non-blocking and posts its verdict as an
      # annotation, because a continue-on-error step always reads green in the job summary
      # and the raw log needs a signed-in reader. When that annotation says passed, this -E
      # and the probe itself both go away. algo.point_cloud_normal_estimation used to be
      # excluded here as well: with Boost's graph it ran tens of minutes on a hosted runner
      # against a 180 s timeout, and it now uses the Boost-free MST path (3.2 s Release
      # measured locally on 2026-11-14).
      # Runs the suite but keeps its own verdict legible: a ctest failure otherwise survives here
      # only as "Process completed with exit code 8", and an Actions job log needs a signed-in
      # reader. The failing test names are posted as an annotation from CTest's own summary block.
      - name: Test Vulkan on macOS
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          log="$RUNNER_TEMP/ctest-vulkan-macos.log"
          status=0
          ctest --test-dir build-vulkan --output-on-failure -C Release -E '^vulkan\.transparency$' > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            failed="$(sed -n '/The following tests FAILED:/,$p' "$log" | sed -n 's/^[[:space:]]*[0-9][0-9]* - \([^ ]*\) .*/\1/p' | paste -sd, - || true)"
            # The assertion itself lives only in the step log, which needs a signed-in reader, so
            # the first FAIL lines are carried in the annotation as well.
            reasons="$(grep -m 5 '^FAIL:' "$log" | cut -c1-300 | paste -sd'; ' - || true)"
            echo "::warning::macOS Vulkan suite failed (ctest exit $status): ${failed:-no test names in the summary}${reasons:+ | $reasons}"
          fi
          exit "$status"

      # The runner's MoltenVK and validation layers come from the LunarG SDK, which is the
      # environment the inherited note described, so the answer has to be measured there.
      # !cancelled() because the step above gates the job but must not gate this measurement:
      # in run 15 a suite failure skipped this probe along with it, and the question stayed open.
      # The test carries its own 120 s CTest timeout and this ceiling keeps a hung loader
      # from holding the job.
      - name: Probe linked-list OIT on the SDK MoltenVK (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN' && !cancelled()
        continue-on-error: true
        run: |
          if ctest --test-dir build-vulkan --output-on-failure -C Release -R '^vulkan\.transparency$'; then
            echo '::notice::vulkan.transparency passes on the SDK MoltenVK: drop the -E exclusion above and this probe'
          else
            echo '::warning::vulkan.transparency does not pass on the SDK MoltenVK: the -E exclusion above stays'
          fi
        timeout-minutes: 5

      # Records what the runner actually exposes, so the exclusion below stays verifiable without
      # a signed-in reader. VULKAN_SDK is set on the image (C:\VulkanSDK\1.4.363.1), but its Bin
      # holds the tool under the SDK name, vulkaninfoSDK.exe, not vulkaninfo.exe: run 15 execed
      # the plain path anyway, recorded only exit 127, and the question went unanswered again.
      # Paths are now checked before use, the directory that was searched is named inside the
      # annotation, and a missing tool is not reported as a missing device - the step after this
      # one measures the device through Easy3D's own Vulkan code instead.
      - name: Report Vulkan devices (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        continue-on-error: true
        shell: bash -l {0}
        run: |
          sdk="${VULKAN_SDK:-}"
          if command -v cygpath >/dev/null 2>&1 && [ -n "$sdk" ]; then
            sdk="$(cygpath -u "$sdk")" || sdk="${VULKAN_SDK:-}"
          fi
          info=""
          for c in "${sdk:+$sdk/Bin}/vulkaninfo.exe" "${sdk:+$sdk/Bin}/vulkaninfoSDK.exe"; do
            if [ -f "$c" ]; then info="$c"; break; fi
          done
          if [ -z "$info" ]; then
            found="$(ls -1 "${sdk:+$sdk/Bin}" 2>/dev/null | grep -i vulkaninfo | paste -sd, - || true)"
            echo "::warning::no vulkaninfo executable found (VULKAN_SDK=${VULKAN_SDK:-unset}, searched [${sdk:+$sdk/Bin}], vulkaninfo* entries: [${found:-none}]): the device question goes to the probe below"
            exit 0
          fi
          summary="$RUNNER_TEMP/vulkaninfo-summary.txt"
          status=0
          "$info" --summary > "$summary" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::vulkaninfo at $info could not build a device summary (exit $status): the exclusion below stays"
            exit 0
          fi
          devices="$(sed -n 's/.*deviceName *= *//p' "$summary" | paste -sd, - || true)"
          if [ -n "$devices" ]; then
            echo "::notice::the runner exposes Vulkan device(s) [$devices]: measure the vulkan.* tests instead of excluding them"
          else
            echo "::warning::the runner exposes no Vulkan device: the step below keeps -LE desktop and the vulkan.* exclusion"
          fi
        timeout-minutes: 2

      # A Vulkan device, measured through the library rather than through whatever tools the image
      # happens to ship: one test that needs a device and no window, run outside the exclusion
      # below. CTest registers it with --validation, which would turn a missing validation layer
      # into a failed device probe, so the binary is run without the flag here; the first FAIL line
      # is posted as an annotation so the verdict is legible without a signed-in reader.
      - name: Probe a Vulkan device through the library (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        continue-on-error: true
        shell: bash -l {0}
        run: |
          exe="$(find build-vulkan -name 'easy3d_vulkan_resource_lifetime_test.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo '::warning::easy3d_vulkan_resource_lifetime_test.exe was not built: the device question stays open'
            exit 0
          fi
          log="$RUNNER_TEMP/vulkan-device-probe.log"
          if "$exe" > "$log" 2>&1; then
            cat "$log"
            echo '::notice::the device test passes without --validation on the Windows runner: drop the vulkan.* half of the exclusion below and this probe'
          else
            status=$?
            cat "$log"
            reason="$(grep -m 1 -E '^FAIL:|^Error|error:' "$log" | cut -c1-300 || true)"
            echo "::warning::the device test does not pass on the Windows runner (exit $status): ${reason:-no failure line}; the exclusion below stays"
          fi
        timeout-minutes: 5

      # Until the probe above prints a device, this job assumes Vulkan rendering is
      # unavailable and runs every test that needs neither a Vulkan device nor a
      # desktop context. The point-cloud normal case is no longer in the list: the
      # reason for dropping it was the Boost-based reference it used to run, not the
      # platform, and that reference is gone.
      - name: Test non-graphics suite (Windows Vulkan)
        if: runner.os == 'Windows' && matrix.backend == 'VULKAN'
        shell: bash -l {0}
        run: ctest --test-dir build-vulkan --output-on-failure -C Release -LE desktop -E '^(vulkan\.|viewer\.offscreen)'

      # The exported package is exercised on every OS: install it, then configure and
      # build a consumer with find_package(Easy3D CONFIG). Only the device-dependent
      # binaries are run, and only where the runner can provide a device - Windows
      # stops here because it has none, and the macOS OpenGL job cannot run them
      # either: its desktop-suite probe measured 74/74 failures at context creation
      # ("NSGL: Failed to find a suitable pixel format", run 13), so no GL consumer
      # can start there. The macOS Vulkan job has MoltenVK and runs all three.
      - name: Install package and build consumer (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build-vulkan
          cmake -S tests/viewer/installed -B installed-consumer -G Ninja \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE
          cmake --build installed-consumer

      - name: Install package and build consumer (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          cmake --install build-vulkan --config Release
          cmake -S tests/viewer/installed -B installed-consumer \
            -G "Visual Studio 17 2022" -A x64 \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE
          cmake --build installed-consumer --config Release

      - name: Run installed-package consumers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            test -n "$VK_DRIVER_FILES"
            unset DISPLAY WAYLAND_DISPLAY
            ./installed-consumer/installed_vulkan_consumer
            ./installed-consumer/installed_offscreen_consumer
          else
            xvfb-run -a ./installed-consumer/installed_offscreen_consumer
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ./installed-consumer/installed_viewer_consumer

      - name: Run installed-package consumers (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'VULKAN'
        run: |
          ./installed-consumer/installed_vulkan_consumer
          ./installed-consumer/installed_offscreen_consumer
          ./installed-consumer/installed_viewer_consumer

      - uses: actions/upload-artifact@v7
        if: always() && matrix.backend == 'VULKAN' && runner.os != 'Windows'
        with:
          name: vulkan-capture-${{ matrix.os }}
          path: build-vulkan/tests/artifacts/vulkan.scene/vulkan-bunny.png
