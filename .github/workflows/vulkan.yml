name: Vulkan renderer
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - opengl: "OFF"
            window: "OFF"
          - opengl: "OFF"
            window: "ON"
          - opengl: "ON"
            window: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - name: Configure
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_ENABLE_VULKAN=ON -DEasy3D_ENABLE_OPENGL=${{ matrix.opengl }} \
            -DEasy3D_ENABLE_VULKAN_VIEWER=${{ matrix.window }} \
            -DEasy3D_BUILD_TUTORIALS=OFF -DEasy3D_BUILD_TESTS=OFF \
            -DEasy3D_BUILD_VULKAN_TESTS=ON -DEasy3D_VULKAN_TEST_VALIDATION=ON
      - name: Build
        run: cmake --build build-vulkan --parallel 2
      - name: Validate SPIR-V
        run: |
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/scene_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/scene_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/points_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/points_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/lines_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/lines_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/wide_lines_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/wide_lines_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/overlay_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/overlay_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/graphics/point_selection_comp.spv
      - name: Render without a display using lavapipe
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          unset DISPLAY WAYLAND_DISPLAY
          ctest --test-dir build-vulkan --output-on-failure -LE desktop
      - name: Test native Vulkan windows
        if: matrix.window == 'ON'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ctest --test-dir build-vulkan --output-on-failure -L desktop
      - name: Build and run an installed-package consumer
        run: |
          cmake --install build-vulkan
          cmake -S easy3d/graphics/tests/installed -B installed-consumer -G Ninja \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake"
          cmake --build installed-consumer
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          unset DISPLAY WAYLAND_DISPLAY
          ./installed-consumer/installed_vulkan_consumer
      - uses: actions/upload-artifact@v4
        if: always() && matrix.opengl == 'ON'
        with:
          name: vulkan-capture
          path: build-vulkan/easy3d/viewer/vulkan-bunny.png
