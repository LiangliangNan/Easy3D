name: Vulkan renderer
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: "VULKAN"
            window: "OFF"
          - backend: "VULKAN"
            window: "ON"
          - backend: "OPENGL"
            window: "OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - name: Configure
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DEasy3D_RENDERER_BACKEND=${{ matrix.backend }} \
            -DEasy3D_ENABLE_VULKAN_VIEWER=${{ matrix.window }} \
            -DEasy3D_BUILD_TUTORIALS=OFF -DEasy3D_BUILD_TESTS=OFF \
            -DEasy3D_BUILD_RENDERER_TESTS=ON -DEasy3D_VULKAN_TEST_VALIDATION=ON
      - name: Build
        run: cmake --build build-vulkan --parallel 2
      - name: Validate SPIR-V
        if: matrix.backend == 'VULKAN'
        run: |
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/scene_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/scene_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/points_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/points_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/lines_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/lines_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/wide_lines_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/wide_lines_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/overlay_vert.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/overlay_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/depth_texture_frag.spv
          spirv-val --target-env vulkan1.2 build-vulkan/easy3d/renderer/backends/vulkan/point_selection_comp.spv
      - name: Render without a display using lavapipe
        if: matrix.backend == 'VULKAN'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          unset DISPLAY WAYLAND_DISPLAY
          ctest --test-dir build-vulkan --output-on-failure -LE desktop
      - name: Test configured window backend
        if: matrix.window == 'ON' || matrix.backend == 'OPENGL'
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            ctest --test-dir build-vulkan --output-on-failure -L desktop
      - name: Build and run an installed-package consumer
        run: |
          cmake --install build-vulkan
          cmake -S easy3d/viewer/tests/installed -B installed-consumer -G Ninja \
            -DEasy3D_DIR="${{ github.workspace }}/install/lib/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE
          cmake --build installed-consumer
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          unset DISPLAY WAYLAND_DISPLAY
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            ./installed-consumer/installed_vulkan_consumer
            ./installed-consumer/installed_offscreen_consumer
          else
            xvfb-run -a ./installed-consumer/installed_offscreen_consumer
          fi
          if [ "${{ matrix.window }}" = "ON" ] || [ "${{ matrix.backend }}" = "OPENGL" ]; then
            xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp -noreset' ./installed-consumer/installed_viewer_consumer
          else
            ./installed-consumer/installed_viewer_consumer
          fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.backend == 'VULKAN' && matrix.window == 'ON'
        with:
          name: vulkan-capture
          path: build-vulkan/easy3d/viewer/vulkan-bunny.png
